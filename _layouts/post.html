<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Kraken-503</title>
  <style>
    :root {
      --bg-dark: #0d0d0d;
      --text-dark: #ffffff;
      --accent-green: #00ff9f;
      --accent-yellow: #f5c542;
      --beige-bg: #f6ecd9;
      --beige-text: #222;
    }
    .writeup-page h1 { color: var(--accent-green); }

    body.light-mode .writeup-page h1 {
    color: var(--accent-yellow);
    transition: color 200ms ease;
    }

    .img-rounded{
      max-width: 100%;
      border-radius: 12px;
    }

    body { background: var(--bg-dark); color: var(--text-dark); font-family: "Courier New", monospace; margin:0; padding:0; }
    header { position: relative; text-align: center; padding: 0.1rem; margin-top: 2rem; }
    /* Changed to absolute root path /index.html */
    .home-button { position: absolute; top: 2.5rem; left: 2.5rem; color: var(--accent-green); text-decoration: none; }
    .home-button:hover { color: #fff; }
    .writeup-page { width: 70%; margin: 2rem auto; padding: 2rem; background-color: #111; border: 1px solid #333; border-radius: 6px; box-shadow: 0 0 10px #000; }
    .writeup-page h1 { color: var(--accent-green); margin-top: 0; }
    .writeup-page small { display:block; margin-bottom:1rem; color:#aaa; }
    .back-link { color: var(--accent-green); text-decoration:none; font-weight:bold; }
    .back-link:hover { color:#fff; text-decoration:underline; }
    body.light-mode { background: var(--beige-bg); color: var(--beige-text); }
    body.light-mode .writeup-page { background: #fbf7ef; border: 1px solid #ddd; }
    body.light-mode .home-button { color: var(--accent-yellow); }
    body.light-mode .back-link { color: #006699; }
  </style>
</head>
<body>
  <header>
    <a href="/index.html" class="home-button"><i class="fas fa-home"></i></a>
    <h1 style="font-size: 2.5rem;">Writeups</h1>
  </header>

  <div class="writeup-page">
    <h1 style="font-size: 3rem;">{{ page.title }}</h1>
    
    <small>{{ page.date | date: "%B %d, %Y" }}</small>
    
    <a href="/index.html#writeups" class="back-link">&larr; Back to Writeups</a>
    <br><br>
    
    <div class="writeup-content">
      {{ content }}
    </div>
    
    <section id="comments-section" class="comments-section">
      <h3>Comments</h3>
      <div id="comments"></div>
    </section>

    <div id="comments" class="comments-placeholder"></div>

    <script>
    (function() {
      const placeholder = document.getElementById('comments');
      if (!placeholder) return;

      function insertGiscus(theme) {
        if (document.querySelector('iframe[src*="giscus.app"]') || document.querySelector('script[data-giscus-loaded]')) return;
        const s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-repo', 'kraken-503/kraken-503.github.io');
        s.setAttribute('data-repo-id', 'R_kgDOQ2jqiw');
        s.setAttribute('data-category', 'General');
        s.setAttribute('data-category-id', 'DIC_kwDOQ2jqi84C1Zeh');
        s.setAttribute('data-mapping', 'pathname'); // Keeps tracking comments via unique dynamic clean URL paths
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'bottom');
        s.setAttribute('data-theme', theme || 'preferred_color_scheme');
        s.setAttribute('data-giscus-loaded', '1');
        placeholder.appendChild(s);
      }

      const saved = localStorage.getItem('theme');
      const theme = saved === 'light' ? 'light' : 'dark';

      const io = new IntersectionObserver((entries, obs) => {
        if (entries.some(e => e.isIntersecting)) {
          insertGiscus(theme);
          obs.disconnect();
        }
      }, { rootMargin: '400px' });

      io.observe(placeholder);

      window.addEventListener('storage', (e) => {
        if (e.key !== 'theme') return;
        const newTheme = e.newValue === 'light' ? 'light' : 'dark';
        const iframe = document.querySelector('iframe[src*="giscus.app"]');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: newTheme } } }, 'https://giscus.app');
        }
      });
    })();
    </script>

  </div>

  <script>
    (function(){
      const saved = localStorage.getItem('theme');
      if (saved === 'light') document.body.classList.add('light-mode');
    })();
  </script>

</body>
</html>
